name: Fedora-42 ARM64

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fedora-arm64:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-24.04-arm']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Check GitHub Runner Architecture
      run: |
        echo "=== GitHub Runner Information ==="
        echo "Runner OS: $RUNNER_OS"
        echo "Runner Architecture: $(uname -m)"
        echo "Runner Platform: $(uname -s)-$(uname -m)"
        echo "CPU Info:"
        lscpu | grep "Architecture\|CPU op-mode\|Model name" || true
        echo ""

    - name: Check CPU architecture
      run: lscpu

    - name: Ansible tests for Ubuntu ${{ matrix.ubuntu-version }} on ${{ matrix.platform }}
      run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            fedora:42 /bin/bash -c "
              set -e
              sudo dnf install -y \
              ansible curl wget unzip tar zsh gcc g++ make fontconfig git &&
              mkdir -p ~/.local/{bin,lib,share} &&
              mkdir -p ~/.config &&
              ansible --version &&
              ansible-playbook local.yml &&
              ls -la ~/.local/bin
            "