name: Ubuntu Matrix Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ubuntu-matrix:
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm64' || 'ubuntu-latest' }}
    strategy:
      matrix:
        ubuntu-version: ['20.04', '24.04']
        platform: ['linux/amd64', 'linux/arm64']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check GitHub Runner Architecture
      run: |
        echo "=== GitHub Runner Information ==="
        echo "Runner OS: $RUNNER_OS"
        echo "Runner Architecture: $(uname -m)"
        echo "Runner Platform: $(uname -s)-$(uname -m)"
        echo "CPU Info:"
        lscpu | grep "Architecture\|CPU op-mode\|Model name" || true
        echo ""
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Print LSB Release for Ubuntu ${{ matrix.ubuntu-version }} on ${{ matrix.platform }}
      run: |
        echo "=== Target Configuration ==="
        echo "Target Ubuntu version: ${{ matrix.ubuntu-version }}"
        echo "Target platform: ${{ matrix.platform }}"
        echo ""
        echo "=== Running Ubuntu Container ==="
        docker run --rm --platform=${{ matrix.platform }} ubuntu:${{ matrix.ubuntu-version }} /bin/bash -c "
          apt-get update && 
          apt-get install -y lsb-release && 
          echo '=== LSB Release Information ===' &&
          lsb_release -a &&
          echo '=== Container Architecture Information ===' &&
          echo 'Container architecture: '$(uname -m) &&
          echo 'Container platform: '$(uname -s)-$(uname -m)
        "
