name: Ubuntu Matrix Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ubuntu-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu-version: ['20.04', '24.04']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Print LSB Release for Ubuntu ${{ matrix.ubuntu-version }}
      run: |
        echo "Running on Ubuntu ${{ matrix.ubuntu-version }}"
        docker run --rm ubuntu:${{ matrix.ubuntu-version }} /bin/bash -c "
          apt-get update && 
          apt-get install -y lsb-release && 
          echo '=== LSB Release Information ===' &&
          lsb_release -a
        "
