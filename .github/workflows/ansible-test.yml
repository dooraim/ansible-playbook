name: Ubuntu ARM64 Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ubuntu-arm64:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-20.04-arm', 'ubuntu-24.04-arm']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check GitHub Runner Architecture
      run: |
        echo "=== GitHub Runner Information ==="
        echo "Runner OS: $RUNNER_OS"
        echo "Runner Architecture: $(uname -m)"
        echo "Runner Platform: $(uname -s)-$(uname -m)"
        echo "CPU Info:"
        lscpu | grep "Architecture\|CPU op-mode\|Model name" || true
        echo ""
    
    - name: Check CPU architecture
      run: lscpu
      
    - name: Check OS Version
      run: |
        sudo apt-get update && 
        sudo apt-get install -y lsb-release && 
        echo '=== LSB Release Information ===' &&
        lsb_release -a
