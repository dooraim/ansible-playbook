---
- name: Remove all files
  shell: |
    rm -rf {{ ansible_env.HOME }}/.nvm
    rm -rf {{ ansible_env.HOME }}/.npm
    rm -rf {{ ansible_env.HOME }}/.local/bin/node
    rm -rf {{ ansible_env.HOME }}/.local/bin/npm
  failed_when: false

- name: Ensure is removed
  file:
    path: "{{ ansible_env.HOME }}/.nvm"
    state: absent

- name: Ensure is removed
  file:
    path: "{{ ansible_env.HOME }}/.npm"
    state: absent

- name: Download tarballs with custom names
  get_url:
    url: "{{ nvm_url }}/v{{ nvm_version}}.{{ nvm_extention }}"
    dest: "{{ ansible_env.HOME }}/myapp/"
    mode: '0644'

- name: Ensure ~/.local exists
  file:
    path: "{{ ansible_env.HOME }}/.nvm"
    state: directory
    mode: '0755'

- name: Extract tarballs
  unarchive:
    src: "{{ ansible_env.HOME }}/myapp/nvm-{{ nvm_version }}.{{ nvm_extention }}"
    dest: "{{ ansible_env.HOME }}/myapp"

- name: Moving file
  shell: "mv {{ ansible_env.HOME }}/myapp/nvm-{{ nvm_version }}/* {{ ansible_env.HOME }}/.nvm/."
  args:
    executable: /bin/bash

- name: Install nvm using bash
  shell: |
    export NVM_DIR="$HOME/.nvm" && \
    . "$NVM_DIR/nvm.sh" && \
    nvm install node
  args:
    executable: /bin/bash

- name: Create symlink for node
  shell: ln -sf  ~/.nvm/versions/node/v24.5.0/bin/node ~/.local/bin/node

- name: Create symlink for npm
  shell: ln -sf ~/.nvm/versions/node/v24.5.0/bin/npm ~/.local/bin/npm
