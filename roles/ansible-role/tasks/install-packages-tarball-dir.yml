- name: Remove existing binaries for single-file packages
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin/{{ tarballs_config[item].file_prefix }}"
    state: absent
  vars:
    os: "{{ ansible_system | lower }}"
    arch: "{{ ansible_architecture | lower }}"
  loop:
    - fzf
    - lazygit
    - eza

# URL format: {url}/v{version}/{file_prefix}-{version}-{os_suffix}_{arch_suffix}.{ext}
- name: Download fzf tarball
  ansible.builtin.get_url:
    url: >-
      {{ tarballs_config[item].url }}/v{{ tarballs_config[item].version }}/
      {{- tarballs_config[item].file_prefix -}}-{{ tarballs_config[item].version }}-{{ tarballs_config[item].architectures[arch][os].os_suffix }}_{{- tarballs_config[item].architectures[arch][os].arch_suffix -}}.{{ tarballs_config[item].architectures[arch][os].extension }}
    dest: "{{ ansible_env.HOME }}/myapp/{{ tarballs_config[item].file_prefix }}.{{ tarballs_config[item].architectures[arch][os].extension }}"
    mode: '0644'
  vars:
    os: "{{ ansible_system | lower }}"
    arch: "{{ ansible_architecture | lower }}"
  loop:
    - fzf

# URL format: {url}/v{version}/{file_prefix}_{version}_{os_suffix}_{arch_suffix}.{ext}
- name: Download lazygit tarball
  ansible.builtin.get_url:
    url: >-
      {{ tarballs_config[item].url }}/v{{ tarballs_config[item].version }}/
      {{- tarballs_config[item].file_prefix -}}_{{ tarballs_config[item].version }}_{{ tarballs_config[item].architectures[arch][os].os_suffix }}_{{- tarballs_config[item].architectures[arch][os].arch_suffix -}}.{{ tarballs_config[item].architectures[arch][os].extension }}
    dest: "{{ ansible_env.HOME }}/myapp/{{ tarballs_config[item].file_prefix }}.{{ tarballs_config[item].architectures[arch][os].extension }}"
    mode: '0644'
  vars:
    os: "{{ ansible_system | lower }}"
    arch: "{{ ansible_architecture | lower }}"
  loop:
    - lazygit

# URL format: {url}/v{version}/{file_prefix}_{arch_suffix}-{compiler}.{ext}
# eza only provides Linux binaries; macOS is handled via Homebrew below
- name: Download eza zip (Linux only)
  ansible.builtin.get_url:
    url: >-
      {{ tarballs_config[item].url }}/v{{ tarballs_config[item].version }}/
      {{- tarballs_config[item].file_prefix -}}_{{ tarballs_config[item].architectures[arch]['linux'].arch_suffix }}-{{- tarballs_config[item].architectures[arch]['linux'].compiler -}}.{{ tarballs_config[item].architectures[arch]['linux'].extension }}
    dest: "{{ ansible_env.HOME }}/myapp/{{ tarballs_config[item].file_prefix }}.{{ tarballs_config[item].architectures[arch]['linux'].extension }}"
    mode: '0644'
  vars:
    arch: "{{ ansible_architecture | lower }}"
  loop:
    - eza
  when: ansible_os_family != "Darwin"

- name: Install eza via Homebrew (macOS only)
  ansible.builtin.command: brew install eza
  when: ansible_os_family == "Darwin"
  changed_when: true

- name: Extract single-file tarballs
  ansible.builtin.unarchive:
    src: "{{ ansible_env.HOME }}/myapp/{{ tarballs_config[item].file_prefix }}.{{ tarballs_config[item].architectures[arch][os].extension }}"
    dest: "{{ ansible_env.HOME }}/myapp/"
  vars:
    os: "{{ ansible_system | lower }}"
    arch: "{{ ansible_architecture | lower }}"
  loop:
    - fzf
    - lazygit

- name: Extract eza zip (Linux only)
  ansible.builtin.unarchive:
    src: "{{ ansible_env.HOME }}/myapp/eza.zip"
    dest: "{{ ansible_env.HOME }}/myapp/"
  vars:
    arch: "{{ ansible_architecture | lower }}"
  when: ansible_os_family != "Darwin"

- name: Copy single-file binaries to ~/.local/bin
  ansible.builtin.copy:
    src: "{{ ansible_env.HOME }}/myapp/{{ tarballs_config[item].file_prefix }}"
    dest: "{{ ansible_env.HOME }}/.local/bin/"
    remote_src: yes
    force: yes
  vars:
    os: "{{ ansible_system | lower }}"
    arch: "{{ ansible_architecture | lower }}"
  loop:
    - fzf
    - lazygit

- name: Copy eza binary to ~/.local/bin (Linux only)
  ansible.builtin.copy:
    src: "{{ ansible_env.HOME }}/myapp/eza"
    dest: "{{ ansible_env.HOME }}/.local/bin/"
    remote_src: yes
    force: yes
  when: ansible_os_family != "Darwin"

# URL format: {url}/v{version}/{file_prefix}-v{version}-{arch_suffix}-{compiler}.{ext}
- name: Download bat and fd tarballs
  ansible.builtin.get_url:
    url: >-
      {{- tarballs_config[item].url -}}/v{{- tarballs_config[item].version -}}/
      {{- tarballs_config[item].file_prefix -}}-v{{- tarballs_config[item].version -}}-
      {{- tarballs_config[item].architectures[arch][os].arch_suffix -}}-
      {{- tarballs_config[item].architectures[arch][os].compiler -}}.
      {{- tarballs_config[item].architectures[arch][os].extension -}}
    dest: "{{ ansible_env.HOME }}/myapp/{{ tarballs_config[item].file_prefix }}.{{ tarballs_config[item].architectures[arch][os].extension }}"
    mode: '0644'
  vars:
    os: "{{ ansible_system | lower }}"
    arch: "{{ ansible_architecture | lower }}"
  loop:
    - bat
    - fd

# URL format: {url}/{version}/{file_name}-{version}-{arch_suffix}-{compiler}.{ext}
- name: Download ripgrep tarball
  ansible.builtin.get_url:
    url: >-
      {{- tarballs_config[item].url -}}/{{- tarballs_config[item].version -}}/
      {{- tarballs_config[item].file_name -}}-{{- tarballs_config[item].version -}}-
      {{- tarballs_config[item].architectures[arch][os].arch_suffix -}}-
      {{- tarballs_config[item].architectures[arch][os].compiler -}}.
      {{- tarballs_config[item].architectures[arch][os].extension -}}
    dest: "{{ ansible_env.HOME }}/myapp/{{ tarballs_config[item].file_name }}.{{ tarballs_config[item].architectures[arch][os].extension }}"
    mode: '0644'
  vars:
    os: "{{ ansible_system | lower }}"
    arch: "{{ ansible_architecture | lower }}"
  loop:
    - ripgrep

- name: Extract directory-based tarballs
  ansible.builtin.unarchive:
    src: "{{ ansible_env.HOME }}/myapp/{{ tarballs_config[item].file_name }}.{{ tarballs_config[item].architectures[arch][os].extension }}"
    dest: "{{ ansible_env.HOME }}/myapp/"
  vars:
    os: "{{ ansible_system | lower }}"
    arch: "{{ ansible_architecture | lower }}"
  loop:
    - bat
    - fd
    - ripgrep

- name: Copy bat and fd binaries to ~/.local/bin
  ansible.builtin.copy:
    src: >-
      {{ ansible_env.HOME }}/myapp/
      {{- tarballs_config[item].file_name -}}-v{{- tarballs_config[item].version -}}-
      {{- tarballs_config[item].architectures[arch][os].arch_suffix -}}-
      {{- tarballs_config[item].architectures[arch][os].compiler -}}/{{- tarballs_config[item].file_prefix -}}
    dest: "{{ ansible_env.HOME }}/.local/bin/"
    remote_src: yes
    force: yes
  vars:
    os: "{{ ansible_system | lower }}"
    arch: "{{ ansible_architecture | lower }}"
  loop:
    - bat
    - fd

- name: Copy ripgrep binary to ~/.local/bin
  ansible.builtin.copy:
    src: >-
      {{ ansible_env.HOME }}/myapp/
      {{- tarballs_config[item].file_name -}}-{{- tarballs_config[item].version -}}-
      {{- tarballs_config[item].architectures[arch][os].arch_suffix -}}-
      {{- tarballs_config[item].architectures[arch][os].compiler -}}/{{- tarballs_config[item].file_prefix -}}
    dest: "{{ ansible_env.HOME }}/.local/bin/"
    remote_src: yes
    force: yes
  vars:
    os: "{{ ansible_system | lower }}"
    arch: "{{ ansible_architecture | lower }}"
  loop:
    - ripgrep

- name: Make binaries executable
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin/{{ tarballs_config[item].file_prefix }}"
    mode: '0755'
    state: file
  loop:
    - fzf
    - lazygit
    - bat
    - fd
    - ripgrep

- name: Make eza executable (Linux only)
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin/eza"
    mode: '0755'
    state: file
  when: ansible_os_family != "Darwin"

- name: Check installed versions
  ansible.builtin.command: "{{ ansible_env.HOME }}/.local/bin/{{ item }} --version"
  register: versions
  loop:
    - bat
    - fd
    - fzf
    - lazygit
    - rg
  failed_when: false

- name: Display installed versions
  ansible.builtin.debug:
    msg: "{{ item.stdout_lines[0] | default('Not found') }}"
  loop: "{{ versions.results }}"