---
- name: Download uuu binary
  ansible.builtin.get_url:
    url: "{{ uuu_url }}"
    dest: "{{ ansible_facts['env'].HOME }}/.local/bin/uuu"
    mode: '0755'
    force: yes

- name: Check uuu version
  ansible.builtin.command: "{{ ansible_facts['env'].HOME }}/.local/bin/uuu -version"
  register: uuu_version_out
  changed_when: false
  failed_when: false

- name: Display uuu version
  ansible.builtin.debug:
    msg: >-
      {{ uuu_version_out.stdout_lines[0]
         if uuu_version_out.rc == 0
         else 'uuu not working (' ~ uuu_version_out.stderr ~ '). Install libusb: sudo apt install libusb-1.0-0' }}
