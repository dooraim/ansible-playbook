---
- name: Download tarballs with custom peco
  ansible.builtin.get_url:
    url: "https://github.com/peco/peco/releases/download/v0.5.11/peco_linux_amd64.tar.gz"
    dest: "{{ ansible_env.HOME }}/myapp/peco_linux_amd64.tar.gz"
    mode: '0644'
  when: ansible_architecture in ['x86_64', 'amd64']

- name: Extract tarballs peco
  unarchive:
    src: "{{ ansible_env.HOME }}/myapp/peco_linux_amd64.tar.gz"
    dest: "{{ ansible_env.HOME }}/myapp"
  when: ansible_architecture in ['x86_64', 'amd64']

- name: Copy bin file to ~/.local/bin peco
  copy:
    src: "{{ ansible_env.HOME }}/myapp/peco_linux_amd64/peco"
    dest: "{{ ansible_env.HOME }}/.local/bin/"
    remote_src: yes
  when: ansible_architecture in ['x86_64', 'amd64']

- name: Make file in ~/.local/bin/ executable peco
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin/peco"
    mode: '0755'
    state: file

- name: Download tarballs with custom names
  ansible.builtin.get_url:
    url: "{{ item.url }}/{{ item.version }}/{{ item.name }}-{{ item.version }}-{{ item.arch }}-{{ item.target }}.{{ item.extension }}"
    dest: "{{ ansible_env.HOME }}/myapp/{{ item.name }}-{{ item.version }}-{{ item.arch }}-{{ item.target }}.{{ item.extension }}"
    mode: '0644'
  loop: "{{ tarballs_dir }}"
  when: ansible_architecture in ['x86_64', 'amd64']

- name: Extract tarballs
  unarchive:
    src: "{{ ansible_env.HOME }}/myapp/{{ item.name }}-{{ item.version }}-{{ item.arch }}-{{ item.target }}.{{ item.extension }}"
    dest: "{{ ansible_env.HOME }}/myapp"
  loop: "{{ tarballs_dir }}"
  when: ansible_architecture in ['x86_64', 'amd64']

- name: Copy bin file to ~/.local/bin
  copy:
    src: "{{ ansible_env.HOME }}/myapp/{{ item.name }}-{{ item.version }}-{{ item.arch }}-{{ item.target }}/{{ item.file }}"
    dest: "{{ ansible_env.HOME }}/.local/bin/"
    remote_src: yes
  loop: "{{ tarballs_dir }}"
  when: ansible_architecture in ['x86_64', 'amd64']

- name: Make file in ~/.local/bin/ executable
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin/{{ item.file }}"
    mode: '0755'
    state: file
  loop: "{{ tarballs_dir }}"
  when: ansible_architecture in ['x86_64', 'amd64']

