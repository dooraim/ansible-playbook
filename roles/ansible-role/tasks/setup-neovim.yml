- name: Clone the repository from Git fzy
  git:
    repo: "{{ fzy_source_package_url | default('https://github.com/jhawthorn/fzy.git') }}"
    dest: "{{ ansible_env.HOME }}/myapp/fzy"
    version: "{{ fzy_source_repo_branch | default('master') }}"
    force: yes

- name: Compile and install from source fzy
  args:
    chdir: "{{ ansible_env.HOME }}/myapp/fzy"
  shell: |
    make

- name: Copy bin file to ~/.local/bin fzy
  copy:
    src: "{{ ansible_env.HOME }}/myapp/fzy/fzy"
    dest: "{{ ansible_env.HOME }}/.local/bin/"
    remote_src: yes

- name: Make file in ~/.local/bin/ executable
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin/fzy"
    mode: '0755'
    state: file

- name: Download tarballs neovim locals with custom names
  ansible.builtin.get_url:
    url: "{{ nvim_url }}/{{ nvim_version }}/{{ nvim_name }}.{{ nvim_extension }}"
    dest: "{{ ansible_env.HOME }}/myapp/{{ nvim_name }}.{{ nvim_extension }}"
    mode: '0644'
  when: ansible_architecture in ['x86_64', 'amd64']

- name: Extract tarballs neovim
  unarchive:
    src: "{{ ansible_env.HOME }}/myapp/{{ nvim_name }}.{{ nvim_extension }}"
    dest: "{{ ansible_env.HOME }}/myapp"

- name: Copy bin file to ~/.local/bin for neovim
  copy:
    src: "{{ ansible_env.HOME }}/myapp/{{ nvim_name }}/bin"
    dest: "{{ ansible_env.HOME }}/.local/"
    remote_src: yes

- name: Copy bin file to ~/.local/lib for neovim
  copy:
    src: "{{ ansible_env.HOME }}/myapp/{{ nvim_name }}/lib"
    dest: "{{ ansible_env.HOME }}/.local/"
    remote_src: yes

- name: Copy bin file to ~/.local/share for neovim
  copy:
    src: "{{ ansible_env.HOME }}/myapp/{{ nvim_name }}/share"
    dest: "{{ ansible_env.HOME }}/.local/"
    remote_src: yes

- name: Create nvim directory
  ansible.builtin.copy:
    src: nvim
    dest: "{{ ansible_env.HOME }}/.config/"
    mode: '0644'

- name: Download tarballs neovim locals with custom names
