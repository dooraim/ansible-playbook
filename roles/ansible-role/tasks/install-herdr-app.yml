---
# Herdr desktop app (herdr-app) and its Pokémon Sinnoh layout.
# The official installer puts the app in ~/.local/share/herdr-app (Linux) or
# ~/Applications/Herdr.app (macOS), links herdr-app in ~/.local/bin and
# installs herdr-core (hc) if missing. Running it again updates the app.
- name: Install Herdr app
  ansible.builtin.shell:
    cmd: curl -fsSL {{ herdr_app_install_url }} | sh
    executable: /bin/bash

# Runtime libraries. The Linux build links libxkbcommon-x11, which desktop
# installs usually have but minimal ones (WSL, servers) don't. Without root,
# fetch the .debs with apt-get download, unpack the libraries into
# herdr_app_lib_dir and replace the herdr-app link with a wrapper that adds
# them to LD_LIBRARY_PATH. When the system has them, keep the plain link.
- name: Install herdr-app runtime libraries
  when: ansible_facts['system'] == "Linux"
  vars:
    herdr_app_bin: "{{ ansible_facts['env'].HOME }}/.local/share/herdr-app/herdr-app"
    herdr_app_link: "{{ ansible_facts['env'].HOME }}/.local/bin/herdr-app"
    herdr_app_debs_dir: "{{ temp_dir }}/herdr-app-debs"
  block:
    - name: Check herdr-app shared libraries
      ansible.builtin.command: ldd {{ herdr_app_bin }}
      register: herdr_app_ldd
      changed_when: false

    - name: Remove bundled herdr-app libraries, system ones are enough
      ansible.builtin.file:
        path: "{{ herdr_app_lib_dir }}"
        state: absent
      when: "'not found' not in herdr_app_ldd.stdout"

    - name: Report missing herdr-app libraries on non-Debian hosts
      ansible.builtin.debug:
        msg: >-
          herdr-app is missing: {{ herdr_app_ldd.stdout_lines | select('search', 'not found') | map('trim') | join(', ') }}.
          Install them with the package manager (Fedora: sudo dnf install libxkbcommon-x11)
      when:
        - "'not found' in herdr_app_ldd.stdout"
        - ansible_facts['os_family'] != "Debian"

    - name: Bundle missing herdr-app libraries
      when:
        - "'not found' in herdr_app_ldd.stdout"
        - ansible_facts['os_family'] == "Debian"
      block:
        - name: Create herdr-app package download directory
          ansible.builtin.file:
            path: "{{ herdr_app_debs_dir }}"
            state: directory
            mode: '0755'

        - name: Download herdr-app library packages
          ansible.builtin.command:
            cmd: apt-get download {{ herdr_app_lib_packages | join(' ') }}
            chdir: "{{ herdr_app_debs_dir }}"
          changed_when: true

        - name: Find downloaded herdr-app library packages
          ansible.builtin.find:
            paths: "{{ herdr_app_debs_dir }}"
            patterns: "*.deb"
          register: herdr_app_debs

        - name: Unpack herdr-app library packages
          ansible.builtin.command:
            cmd: dpkg-deb -x {{ item.path }} {{ herdr_app_debs_dir }}/root
          loop: "{{ herdr_app_debs.files }}"
          loop_control:
            label: "{{ item.path | basename }}"
          changed_when: true

        - name: Find unpacked herdr-app libraries
          ansible.builtin.find:
            paths: "{{ herdr_app_debs_dir }}/root"
            patterns: "*.so*"
            file_type: any
            recurse: true
          register: herdr_app_libs

        - name: Create herdr-app library directory
          ansible.builtin.file:
            path: "{{ herdr_app_lib_dir }}"
            state: directory
            mode: '0755'

        - name: Copy herdr-app libraries
          ansible.builtin.copy:
            src: "{{ item.path }}"
            dest: "{{ herdr_app_lib_dir }}/"
            remote_src: true
            follow: true
            mode: '0644'
          loop: "{{ herdr_app_libs.files }}"
          loop_control:
            label: "{{ item.path | basename }}"

        # install.sh recreates the link at every run: replace it, don't write through it
        - name: Remove herdr-app link
          ansible.builtin.file:
            path: "{{ herdr_app_link }}"
            state: absent

        - name: Install herdr-app wrapper
          ansible.builtin.copy:
            dest: "{{ herdr_app_link }}"
            mode: '0755'
            content: |
              #!/bin/sh
              # Generated by Ansible: runs herdr-app with the libraries bundled in {{ herdr_app_lib_dir }}
              LD_LIBRARY_PATH="{{ herdr_app_lib_dir }}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" exec "{{ herdr_app_bin }}" "$@"

        - name: Check herdr-app shared libraries with bundled ones
          ansible.builtin.command: ldd {{ herdr_app_bin }}
          environment:
            LD_LIBRARY_PATH: "{{ herdr_app_lib_dir }}"
          register: herdr_app_ldd_bundled
          changed_when: false

        - name: Report herdr-app libraries still missing
          ansible.builtin.debug:
            msg: >-
              herdr-app is still missing: {{ herdr_app_ldd_bundled.stdout_lines | select('search', 'not found') | map('trim') | join(', ') }}.
              Add their packages to herdr_app_lib_packages
          when: "'not found' in herdr_app_ldd_bundled.stdout"

# Sinnoh layout: Ansible equivalent of the repo's install.sh. Copies only the
# layout's own files into the herdr-app home and merges its key bindings into
# keys.json, keeping any binding already set (install.sh asks; here the answer
# is "no").
- name: Set herdr-app home directory
  ansible.builtin.set_fact:
    herdr_app_home: "{{ ansible_facts['env'].HERDR_APP_HOME | default(ansible_facts['env'].HOME ~ '/.config/herdr-app', true) }}"

- name: Check herdr-app home directory
  ansible.builtin.stat:
    path: "{{ herdr_app_home }}"
  register: herdr_app_home_stat

- name: Skip Sinnoh layout, herdr-app not set up
  ansible.builtin.debug:
    msg: "{{ herdr_app_home }} not found: open the Herdr app once (herdr-app) to create it, then run again with --tags herdr-app to install the Sinnoh layout"
  when: not (herdr_app_home_stat.stat.isdir | default(false))

- name: Install herdr-app Sinnoh layout
  when: herdr_app_home_stat.stat.isdir | default(false)
  vars:
    herdr_sinnoh_src: "{{ temp_dir }}/herdr-sinnoh"
  block:
    - name: Clone herdr-sinnoh repository
      ansible.builtin.git:
        repo: "{{ herdr_sinnoh_repo }}"
        dest: "{{ herdr_sinnoh_src }}"
        version: "{{ herdr_sinnoh_version }}"
        depth: 1
        force: true

    - name: Create herdr-app layout directories
      ansible.builtin.file:
        path: "{{ herdr_app_home }}/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - layouts
        - themes
        - mods

    - name: Copy Sinnoh layouts and themes
      ansible.builtin.copy:
        src: "{{ herdr_sinnoh_src }}/{{ item }}"
        dest: "{{ herdr_app_home }}/{{ item }}"
        remote_src: true
        mode: '0644'
      loop:
        - layouts/pokemon.json
        - layouts/pokemon.svg
        - themes/pokemon.json
        - themes/pokemon-night.json

    # install.sh uses rsync --delete: start from an empty mod directory
    - name: Remove existing pokemon mod
      ansible.builtin.file:
        path: "{{ herdr_app_home }}/mods/pokemon"
        state: absent

    - name: Copy pokemon mod
      ansible.builtin.copy:
        src: "{{ herdr_sinnoh_src }}/mods/pokemon"
        dest: "{{ herdr_app_home }}/mods/"
        remote_src: true
        mode: preserve

    - name: Find editor-only files in pokemon mod
      ansible.builtin.find:
        paths: "{{ herdr_app_home }}/mods/pokemon"
        patterns:
          - jsconfig.json
          - "*.d.ts"
        recurse: true
      register: herdr_sinnoh_dev_files

    - name: Remove editor-only files from pokemon mod
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ herdr_sinnoh_dev_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Read layout key bindings
      ansible.builtin.slurp:
        src: "{{ herdr_sinnoh_src }}/mods/pokemon/keys.json"
      register: herdr_sinnoh_keys

    - name: Check existing herdr-app keys.json
      ansible.builtin.stat:
        path: "{{ herdr_app_home }}/keys.json"
      register: herdr_app_keys_stat

    - name: Read existing herdr-app keys.json
      ansible.builtin.slurp:
        src: "{{ herdr_app_home }}/keys.json"
      register: herdr_app_keys
      when: herdr_app_keys_stat.stat.exists

    # Existing bindings win over the layout's ones
    - name: Merge Sinnoh key bindings into keys.json
      ansible.builtin.copy:
        content: >-
          {{ (herdr_sinnoh_keys.content | b64decode | from_json)
             | combine(herdr_app_keys.content | b64decode | from_json
                       if herdr_app_keys_stat.stat.exists else {}, recursive=true)
             | to_nice_json(indent=2) }}
        dest: "{{ herdr_app_home }}/keys.json"
        mode: '0644'
        backup: true

    - name: Show how to switch to the Sinnoh layout
      ansible.builtin.debug:
        msg: >-
          Installed to {{ herdr_app_home }}. Switch to it with
          herdr-app do layout.switch '{"name":"pokemon"}' (or ctrl-shift-l in the app)
