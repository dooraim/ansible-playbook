---
- name: Download tarballs with custom names
  ansible.builtin.get_url:
    url: "{{ item.url }}/{{ item.version }}/{{ item.name }}-{{ item.version }}-x86_64-{{ item.target }}.{{ item.extension }}"
    dest: "{{ ansible_env.HOME }}/myapp/{{ item.name }}.{{ item.extension }}"
    mode: '0644'
  loop: "{{ tarballs_dir }}"
  when: ansible_architecture in ['x86_64', 'amd64']

- name: Extract tarballs
  unarchive:
    src: "{{ ansible_env.HOME }}/myapp/{{ item.name }}.{{ item.extension }}"
    dest: "{{ ansible_env.HOME }}/myapp/"
  loop: "{{ tarballs_dir }}"

- name: Ensure is removed
  file:
    path: "{{ ansible_env.HOME }}/.local/bin/{{ item.file }}"
    state: absent
  loop: "{{ tarballs_dir }}"

- name: Copy bin file to ~/.local/bin
  copy:
    src: "{{ ansible_env.HOME }}/myapp/{{ item.name }}-{{ item.version }}-x86_64-{{ item.target }}/{{ item.file }}"
    dest: "{{ ansible_env.HOME }}/.local/bin/"
    remote_src: yes
    force: yes
  loop: "{{ tarballs_dir }}"
  when: ansible_architecture in ['x86_64', 'amd64']

- name: Make file {{ item.name }} in ~/.local/bin/ executable
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin/{{ item.file }}"
    mode: '0755'
    state: file
  loop: "{{ tarballs_dir }}"


