- name: Remove myapp
  ansible.builtin.file:
    path: "~{{ username }}/myapp"
    state: absent

- name: Create ~/myapp directory
  ansible.builtin.file:
    path: ~{{ username }}/myapp
    state: directory
    mode: '0755'

- name: Ensure ~/.local exists
  file:
    path: "{{ ansible_env.HOME }}/.local"
    state: directory
    mode: '0755'

- name: Run task only on x86_64 or amd64
  ansible.builtin.debug:
    msg: "This host is x86_64 or amd64"
  when: ansible_architecture in ['x86_64', 'amd64']

- name: Remove ~/.local/bin/ files
  ansible.builtin.file:
    path: "~{{ username }}/.local/bin/*"
    state: absent

- name: Remove ~/.local/lib/ files
  ansible.builtin.file:
    path: "~{{ username }}/.local/lib/*"
    state: absent

- name: Remove ~/.local/share/ files
  ansible.builtin.file:
    path: "~{{ username }}/.local/share/*"
    state: absent

- name: Download tarballs with custom names
  ansible.builtin.get_url:
    url: "{{ item.url }}/{{ item.version }}/{{ item.name }}.{{ item.extension }}"
    dest: "~{{ username }}/myapp/{{ item.name }}.{{ item.extension }}"
    mode: '0644'
  loop: "{{ tarballs_dir }}"
  when: ansible_architecture in ['x86_64', 'amd64']

- name: Extract tarballs
  become: false
  become_user: "{{ username }}"
  unarchive:
    src: "~{{ username }}/myapp/{{ item.name }}.{{ item.extension }}"
    dest: "~{{ username }}/myapp"
  loop: "{{ tarballs_dir }}"
  when: ansible_architecture in ['x86_64', 'amd64']

- name: Copy bin file to ~/.local/bin
  become: false
  become_user: "{{ username }}"
  copy:
    src: "~{{ username }}/myapp/{{ item.name }}/{{ item.file }}"
    dest: "~{{ username }}/.local/bin/"
    remote_src: yes
  loop: "{{ tarballs_dir }}"
  when: ansible_architecture in ['x86_64', 'amd64']

- name: Make file in ~/.local/bin/lazygit executable
  become: false
  become_user: "{{ username }}"
  ansible.builtin.file:
    path: "~{{ username }}/.local/bin/{{ item.file }}"
    mode: '0755'
    state: file
  loop: "{{ tarballs_dir }}"
  when: ansible_architecture in ['x86_64', 'amd64']

- name: Download tarballs with custom names
  ansible.builtin.get_url:
    url: "{{ item.url }}/{{ item.version }}/{{ item.name }}.{{ item.extension }}"
    dest: "~{{ username }}/myapp/{{ item.name }}.{{ item.extension }}"
    mode: '0644'
  loop: "{{ tarballs_file }}"
  when: ansible_architecture in ['x86_64', 'amd64']

- name: Extract tarballs
  become: false
  become_user: "{{ username }}"
  unarchive:
    src: "~{{ username }}/myapp/{{ item.name }}.{{ item.extension }}"
    dest: "~{{ username }}/myapp"
  loop: "{{ tarballs_file }}"
  when: ansible_architecture in ['x86_64', 'amd64']

- name: Copy bin file to ~/.local/bin
  become: false
  become_user: "{{ username }}"
  copy:
    src: "~{{ username }}/myapp/{{ item.file }}"
    dest: "~{{ username }}/.local/bin/"
    remote_src: yes
  loop: "{{ tarballs_file }}"
  when: ansible_architecture in ['x86_64', 'amd64']

- name: Make file in ~/.local/bin/ executable
  become: false
  become_user: "{{ username }}"
  ansible.builtin.file:
    path: "~{{ username }}/.local/bin/{{ item.file }}"
    mode: '0755'
    state: file
  loop: "{{ tarballs_file }}"

- name: Ensure build dependencies are present
  become: false
  become_user: "{{ username }}"
  package:
    name:
      - build-essential  # for Debian/Ubuntu
      - gcc
      - make
      - git
    state: present
  when: ansible_os_family == "Debian"

- name: Clone the repository from Git fzy
  become: false
  become_user: "{{ username }}"
  git:
    repo: "{{ fzy_source_package_url | default('https://github.com/jhawthorn/fzy.git') }}"
    dest: "~{{ username }}/myapp/fzy"
    version: "{{ fzy_source_repo_branch | default('master') }}"
    force: yes

- name: Compile and install from source fzy
  become: false
  become_user: "{{ username }}"
  args:
    chdir: "~{{ username }}/myapp/fzy"
  shell: |
    make

- name: Copy bin file to ~/.local/bin fzy
  become: false
  become_user: "{{ username }}"
  copy:
    src: "~{{ username }}/myapp/fzy/fzy"
    dest: "~{{ username }}/.local/bin/"
    remote_src: yes

- name: Download tarballs neovim locals with custom names
  ansible.builtin.get_url:
    url: "{{ nvim_url }}/{{ nvim_version }}/{{ nvim_name }}.{{ nvim_extension }}"
    dest: "~{{ username }}/myapp/{{ nvim_name }}.{{ nvim_extension }}"
    mode: '0644'
  when: ansible_architecture in ['x86_64', 'amd64']

- name: Extract tarballs neovim
  become: false
  become_user: "{{ username }}"
  unarchive:
    src: "~{{ username }}/myapp/{{ nvim_name }}.{{ nvim_extension }}"
    dest: "~{{ username }}/myapp"

- name: Copy bin file to ~/.local/bin for neovim
  become: false
  become_user: "{{ username }}"
  copy:
    src: "~{{ username }}/myapp/{{ nvim_file }}/bin"
    dest: "~{{ username }}/.local/"
    remote_src: yes

- name: Copy lib file to ~/.local/lib for neovim
  become: false
  become_user: "{{ username }}"
  copy:
    src: "~{{ username }}/myapp/{{ nvim_file }}/lib"
    dest: "~{{ username }}/.local/"
    remote_src: yes

- name: Copy bin file to ~/.local/share for neovim
  become: false
  become_user: "{{ username }}"
  copy:
    src: "~{{ username }}/myapp/{{ nvim_file }}/share"
    dest: "~{{ username }}/.local/"
    remote_src: yes
